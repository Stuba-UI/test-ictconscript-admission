<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logbook test</title>
    <style>
        body {
            font-family: monospace;
            background: #111;
            color: #ddd;
            margin: 1rem;
        }

        h1 {
            color: #7c5;
            font-size: 1.2rem;
        }

        .entry {
            border: 1px solid #333;
            border-radius: 6px;
            padding: .6rem;
            margin: .5rem 0;
        }

        .time {
            color: #7c5;
            font-size: .8rem;
        }

        .coords {
            color: #fa4;
            font-size: .8rem;
        }

        input, textarea, button {
            width: 100%;
            box-sizing: border-box;
            margin: .2rem 0;
            background: #222;
            color: #ddd;
            border: 1px solid #444;
            border-radius: 4px;
            padding: .5rem;
        }

        button {
            background: #7c5;
            color: #111;
            font-weight: bold;
        }

        #msg {
            color: #f66;
            min-height: 1.2rem;
        }
    </style>
</head>
<body>
    <h1>Unit Logbook — test console</h1>

    <form id="f">
        <input id="title" placeholder="Title (max 120)">
        <textarea id="body" rows="2" placeholder="Body"></textarea>
        <input id="lat" placeholder="Lat (optional)">
        <input id="lon" placeholder="Lon (optional)">
        <button>Add entry</button>
    </form>
    <div id="msg"></div>
    <div id="list">loading…</div>

    <script>
async function load() {
  const res = await fetch('/entries');
  const entries = await res.json();
  document.getElementById('list').innerHTML = entries.map(e => `
    <div class="entry">
      <div class="time">#${e.id} · ${e.isoTime}</div>
      <b>${e.title}</b>
      <div>${e.body}</div>
      ${e.lat !== null ? `<div class="coords">?? ${e.lat}, ${e.lon}</div>` : ''}
    </div>`).join('');
}

document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const val = id => document.getElementById(id).value.trim();
  const payload = { title: val('title'), body: val('body') };
  if (val('lat')) payload.lat = parseFloat(val('lat'));
  if (val('lon')) payload.lon = parseFloat(val('lon'));

  const res = await fetch('/entries', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  const data = await res.json();
  document.getElementById('msg').textContent = res.ok ? '' : (data.error || 'error');
  if (res.ok) { document.getElementById('f').reset(); load(); }
});

load();
    </script>
</body>
</html>
